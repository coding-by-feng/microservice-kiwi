server:
  port: 5002

logging:
  level:
    org.springframework.boot: DEBUG
    me.fengorz.kiwi.*: DEBUG

spring:
  application:
    name: kiwi-flow
  profiles:
    active: dev,prod
  cloud:
    config:
      fail-fast: true
      name: ${spring.application.name}
      discovery:
        service-id: kiwi-config
        enabled: true
      profile: ${spring.profiles.active}
  main:
    allow-bean-definition-overriding: true
  security:
    user:
      password: changeme
      name: changeme

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://eureka:changeme@kiwi-eureka:8762/eureka

