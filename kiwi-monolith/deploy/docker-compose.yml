version: '3.8'

services:
  # MySQL Database
  kiwi-mysql:
    image: mysql:8.0
    container_name: kiwi-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3307"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-kiwi_db}
      TZ: ${TZ:-Pacific/Auckland}
    command: >
      --port=3307
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  kiwi-redis:
    image: redis:7-alpine
    container_name: kiwi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6380"
    command: redis-server --port 6380 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  kiwi-elasticsearch:
    image: elasticsearch:7.17.9
    container_name: kiwi-elasticsearch
    restart: unless-stopped
    ports:
      - "${ES_PORT:-9201}:9201"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD must be set}
      - http.port=9201
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD:?ES_PASSWORD must be set} http://localhost:9201/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Object Storage
  kiwi-minio:
    image: minio/minio
    container_name: kiwi-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: ${TZ:-Pacific/Auckland}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization (one-shot)
  kiwi-minio-init:
    image: minio/mc
    container_name: kiwi-minio-init
    depends_on:
      kiwi-minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set kiwi http://kiwi-minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing kiwi/$${MINIO_BUCKET:-kiwi};
      exit 0;
      "

  # Kiwi Application
  kiwi-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kiwi-monolith:latest
    container_name: kiwi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KIWI_REDIS_PASSWORD: ${REDIS_PASSWORD:-kiwi123}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      KIWI_ENC_PASSWORD: ${KIWI_ENC_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/application_default_credentials.json
      GCP_CREDENTIALS_LOCATION: /app/credentials/application_default_credentials.json
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: ${TZ:-Pacific/Auckland}
      JVM_OPTS: >-
        -Xms256m -Xmx512m -XX:+UseG1GC
        -Dspring.profiles.active=prod
        -Djasypt.encryptor.password=${KIWI_ENC_PASSWORD:-changeme}
        -Dserver.port=8080
        -Dspring.datasource.username=root
        -Dspring.datasource.password=${DB_PASSWORD:-changeme}
        -Dspring.elasticsearch.username=elastic
        -Dspring.elasticsearch.password=${ES_PASSWORD:-changeme}
        -Dspring.autoconfigure.exclude=org.flowable.spring.boot.ProcessEngineAutoConfiguration,org.flowable.spring.boot.app.AppEngineAutoConfiguration,org.flowable.spring.boot.idm.IdmEngineAutoConfiguration,org.flowable.spring.boot.idm.IdmEngineServicesAutoConfiguration,org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration,org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration,org.flowable.spring.boot.FlowableSecurityAutoConfiguration,org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration,org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration,org.flowable.spring.boot.ProcessEngineServicesAutoConfiguration,org.flowable.spring.boot.app.AppEngineServicesAutoConfiguration,org.flowable.spring.boot.cmmn.CmmnEngineServicesAutoConfiguration,org.flowable.spring.boot.dmn.DmnEngineServicesAutoConfiguration,org.flowable.spring.boot.EndpointAutoConfiguration
    depends_on:
      kiwi-mysql:
        condition: service_healthy
      kiwi-redis:
        condition: service_healthy
      kiwi-elasticsearch:
        condition: service_healthy
      kiwi-minio:
        condition: service_healthy
    volumes:
      - wordtmp_data:/wordTmp
      - ${YT_DOWNLOAD_PATH:-/home/kason/ytb-data}:/data/ytb-data
      - ${YT_COOKIES_PATH:-/home/kason/.config/yt-dlp/cookies.txt}:/data/cookies.txt
      - ./application_default_credentials.json:/app/credentials/application_default_credentials.json:ro

volumes:
  mysql_data:
    name: kiwi_mysql_data
  redis_data:
    name: kiwi_redis_data
  es_data:
    name: kiwi_es_data
  minio_data:
    name: kiwi_minio_data
  wordtmp_data:
    name: kiwi_wordtmp_data
