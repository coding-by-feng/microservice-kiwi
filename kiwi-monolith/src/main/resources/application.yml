# ==================== Kiwi Monolith Application Configuration ====================
# Spring Boot 3.2 + Java 17
# Consolidated from microservices: kiwi-upms, kiwi-word, kiwi-ai, kiwi-tools, kiwi-flow, kiwi-auth
#
# Profile-specific configurations:
#   - application-dev.yml  : Local development environment
#   - application-test.yml : Test/Staging environment
#   - application-prod.yml : Production environment

server:
  servlet:
    context-path: /
  undertow:
    threads:
      io: 16
      worker: 256

spring:
  application:
    name: kiwi-monolith

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ==================== Datasource Common Configuration ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

# ==================== MyBatis Plus Configuration ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: me.fengorz.kiwi.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDel
      logic-delete-value: "Y"
      logic-not-delete-value: "N"
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

  # ==================== OAuth2 Security ====================
spring.security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${OAUTH2_ISSUER_URI:https://accounts.google.com}
        jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID:your-client-id}
          client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
          scope:
            - openid
            - profile
            - email
      provider:
        google:
          authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
          token-uri: https://oauth2.googleapis.com/token
          user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  # ==================== Jackson ====================
spring.jackson:
  date-format: yyyy-MM-dd HH:mm:ss
  time-zone: Pacific/Auckland
  serialization:
    write-dates-as-timestamps: false

  # ==================== Main Configuration ====================
spring.main:
  allow-bean-definition-overriding: true

# ==================== Jasypt Encryption ====================
jasypt:
  encryptor:
    password: ${KIWI_ENC_PASSWORD}
    pool-size: 2
    algorithm: PBEWithMD5AndDES

# ==================== Resilience4j ====================
resilience4j:
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 100
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 60s
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
  ratelimiter:
    instances:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 5s

# ==================== Actuator ====================
management:
  endpoint:
    health:
      probes:
        enabled: true

# ==================== Logging Pattern ====================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==================== SpringDoc OpenAPI ====================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# ==================== Application Custom Config (Common) ====================
kiwi:
  # Redis Messaging Configuration
  messaging:
    enabled: true
    topics:
      word-fetch: kiwi:word:fetch
      word-crawl: kiwi:word:crawl
      ai-task: kiwi:ai:task
      notification: kiwi:notification
