# ==================== Google OAuth2 Configuration ====================
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: https://kason.app/auth/oauth/google/callback
    scopes:
      - openid
      - profile
      - email
    home-page: https://kason.app

# ==================== Security Ignore URLs ====================
ignore:
  urls:
    # Common
    - /test/**
    # Auth endpoints (public)
    - /auth/oauth/google/**
    - /log/**
    # UPMS Service (new /api prefix)
    - /api/log/**
    # Word Service (new /api prefix)
    - /api/word/name/**
    - /api/word/search
    - /api/word/fuzzy
    - /api/word/autocomplete
    - /api/word/exists/**
    - /api/word/pronunciation/download/**
    - /api/word/fetch/**
    - /api/word/main/fuzzyQueryList
    - /api/word/main/query/**
    # Tools Service (legacy paths)
    - /rangi_windows/api/**
    # Tools Service (new /api prefix)
    - /api/rangi_windows/**
