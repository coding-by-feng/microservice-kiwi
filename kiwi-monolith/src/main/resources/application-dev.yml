# ==================== Development Profile Configuration ====================
# Local development environment settings

server:
  port: 8088

spring:
  # ==================== Flowable Exclusion ====================
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration

  # ==================== Database ====================
  datasource:
    url: jdbc:mysql://${DB_HOST_DEV:localhost}:${DB_PORT_DEV:3307}/${DB_NAME_DEV:kiwi_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Pacific/Auckland
    username: ${DB_USERNAME_DEV:root}
    password: ${DB_PASSWORD_DEV:kiwi123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      max-lifetime: 1800000
      connection-timeout: 60000
      initialization-fail-timeout: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST_DEV:localhost}
      port: ${REDIS_PORT_DEV:6380}
      password: ${REDIS_PASSWORD_DEV:kiwi123}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 100ms

  # ==================== Redis (for Redisson) ====================
  redis:
    host: ${REDIS_HOST_DEV:localhost}
    port: ${REDIS_PORT_DEV:6380}
    password: ${REDIS_PASSWORD_DEV:kiwi123}
    database: 0

  # ==================== Elasticsearch ====================
  elasticsearch:
    uris: ${ES_URIS_DEV:http://localhost:9201}
    username: ${ES_USERNAME_DEV:elastic}
    password: ${ES_PASSWORD_DEV}

  # ==================== File Upload ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==================== GCP Configuration ====================
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:ENC(5q3wUNe5RH6F8ORU+aaVqa5XK6bF5pJwdHzcloHX3Uz2PyTTN5C7kw==)}
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION:ENC(cicvoPPUGdVt01NMX91FN2X7ud3c6Fiu5CchvC8LDYEFENPuURkzAL0TXBJSBpaqs1w2Gbv5nZg=)}

  # ==================== Liquibase ====================
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

# ==================== Flowable (Disabled) ====================
flowable:
  process:
    enabled: false
  app:
    enabled: false
  idm:
    enabled: false
  cmmn:
    enabled: false
  dmn:
    enabled: false
  eventregistry:
    enabled: false
  async-executor-activate: false
  database-schema-update: false

# ==================== Storage ====================
storage:
  backend: ${STORAGE_BACKEND_DEV:minio}

ftp:
  host: ${FTP_HOST_DEV:localhost}
  port: ${FTP_PORT_DEV:22}
  username: ${FTP_USER_DEV:ftpuser}
  password: ${FTP_PASSWORD_DEV}
  baseDir: /kason-tools
  passiveMode: true
  connectTimeout: 15000
  dataTimeout: 30000

minio:
  endpoint: ${MINIO_ENDPOINT_DEV:http://localhost:9001}
  accessKey: ${MINIO_ACCESS_KEY_DEV:kiwi}
  secretKey: ${MINIO_SECRET_KEY_DEV:kiwi123456}
  bucket: ${MINIO_BUCKET_DEV:kiwi}
  connectTimeout: 10000
  readTimeout: 30000
  writeTimeout: 60000

# ==================== Logging ====================
logging:
  level:
    root: INFO
    me.fengorz.kiwi.config.RequestResponseLoggingFilter: DEBUG
    me.fengorz.kiwi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false

# ==================== Application Custom Config ====================
kiwi:
  # CORS Configuration
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173

  # One-time code authentication (for anonymous access to trusted apps)
  auth:
    one-time-code: ${KIWI_ONE_TIME_CODE:}

  # HTTP Request/Response Logging (enable for debugging)
  logging:
    http:
      enabled: true
      include-headers: true
      include-body: true

  # FastDFS Configuration
  dfs:
    connect-timeout: 6000000
    so-timeout: 6000000
    tracker-list: ${FASTDFS_TRACKER_DEV:localhost:22122}
    gcp:
      bucket-name: kiwidict-bucket

  # File paths for dev environment
  file:
    crawler:
      voice:
        tmp-path: ${VOICE_TMP_PATH:/Users/zhanshifeng/Documents/myDocument/temp/microSerivceVocabularyEnhancer}
    vocabulary:
      word:
        list:
          path: ${WORD_LIST_PATH:/Users/zhanshifeng/Downloads}

  # TTS Configuration
  tts:
    # TTS Provider Selection: voicerss, baidu, gcp, deepgram, openai
    provider: openai
    chattts:
      base-url: http://kiwi-chattts:8000
      timeout: 30
      retry-count: 3
    deepgram:
      api-key: ${DEEPGRAM_API_KEY:}
      base-url: https://api.deepgram.com/v1/speak
      english-model: aura-asteria-en
      chinese-model: aura-lingxi-zh
    baidu:
      app-id: "20116041"
      api-key: ${BAIDU_TTS_API_KEY:ENC(/9nXqvG1VIte1VrACwZ683gw2o2K3fpRdAweh0edh1nFLd1CvjH4oA==)}
      secret-key: ${BAIDU_TTS_SECRET_KEY:ENC(G1gyeiupF4SDLkxRGm6FJ5a+Xxpp36sIrrtUnu5xZFKtZGnA7WYCPy+t+XHO0Kaa)}
      access-token: ${BAIDU_TTS_ACCESS_TOKEN:ENC(wykNby8I8mtu8pV5zd8khs8oUoF1GSFuS+y7zVGGhvHCF6+sUSUeSK3p3Q57wddHbZjYujpgoUMisz+fneF4E8tOpgTpdlThYC4j/tHtJfs=)}
    voicerss:
      url: 'https://api.voicerss.org/?key={}&r=-2&hl=en-us&v=Mary&c=MP3&f=16khz_16bit_stereo&src=test'
      api-keys: ${VOICERSS_API_KEYS:[]}
    # OpenAI TTS - $15/1M chars (tts-1, tts-1-hd, gpt-4o-mini-tts)
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1/audio/speech
      # Model options:
      # - tts-1: Standard quality, faster
      # - tts-1-hd: High quality
      # - gpt-4o-mini-tts: Steerable TTS with accent control
      model: gpt-4o-mini-tts
      english-voice: alloy  # alloy, echo, fable, onyx, nova, shimmer, coral, sage, ash
      chinese-voice: nova
      # English accent (only works with gpt-4o-mini-tts): US, UK, AU, IN
      english-accent: UK
      response-format: mp3  # mp3, opus, aac, flac, wav, pcm
      speed: 1.0  # 0.25 to 4.0

  # AI Conversation Generator Configuration
  ai:
    conversation:
      enabled: true
      # Maximum conversations per user per day
      max-daily-generations: 10
      # FTP storage path for conversation audio
      audio-storage-path: /conversation-audio
      # Delay between TTS API calls (ms) to avoid rate limiting
      tts-delay-ms: 200
      # SSE timeout in milliseconds (10 minutes)
      sse-timeout-ms: 600000
      # Speaker limits
      max-speakers: 4
      min-speakers: 2
      # Cache TTL in seconds
      cache-ttl-seconds: 3600

  # Gemini Image Generation Configuration (Vertex AI)
  gemini:
    project-id: ${GCP_PROJECT_ID:ENC(5q3wUNe5RH6F8ORU+aaVqa5XK6bF5pJwdHzcloHX3Uz2PyTTN5C7kw==)}
    location: us-central1
    image-model: imagen-4.0-generate-001
    image-width: 1024
    image-height: 1024
    number-of-images: 1
    enabled: true

  # Notes Feature Configuration
  notes:
    image-styles:
      - id: ghibli
        name: Studio Ghibli
        description: Hand-drawn animation inspired by Hayao Miyazaki with vibrant watercolor textures
        prompt: "Studio Ghibli style, hand-drawn animation, inspired by Hayao Miyazaki, vibrant watercolor textures, lush greenery, nostalgic atmosphere, high aesthetic, detailed scenery, soft sunlight, 8k resolution."
        enabled: true
        sort-order: 1

      - id: cyberpunk
        name: Cyberpunk
        description: Futuristic metropolis at night with neon lights and rain-slicked streets
        prompt: "Cyberpunk aesthetic, futuristic sprawling metropolis at night, rain-slicked streets reflecting neon signs, towering skyscrapers with holographic advertisements, flying vehicles leaving light trails, detailed cybernetic implants, high contrast lighting, deep blues, purples, and electric greens, gritty and highly detailed, Blade Runner inspired, 8k resolution."
        enabled: true
        sort-order: 2

      - id: oil-painting
        name: Classical Oil Painting
        description: Renaissance-inspired fine art with rich colors and dramatic lighting
        prompt: "Classical oil painting style, Renaissance era inspiration, rich and deep color palette, visible textured brushstrokes on aged canvas, dramatic chiaroscuro lighting (strong contrast between light and dark), highly detailed fabric drapery and anatomical precision, museum quality fine art, Rembrandt inspired, somber and grand atmosphere."
        enabled: true
        sort-order: 3

      - id: pixar
        name: Pixar 3D Animation
        description: Modern 3D animated movie style with polished rendering and expressive characters
        prompt: "Modern 3D animated movie style, Pixar or Disney animation inspiration, highly polished and clean rendering, expressive character designs with large eyes, vibrant and warm cinematic lighting, photorealistic textures for hair, fur, and cloth, volumetric fog and particle effects, high-budget CGI look, sharp focus, 8k 3D render."
        enabled: true
        sort-order: 4

      - id: graphic-novel
        name: Graphic Novel
        description: Sin City inspired black and white illustration with stark contrast
        prompt: "Graphic novel illustration style, Sin City inspiration, stark black and white with high contrast, no greyscale, heavy ink outlines and cross-hatching shadows, gritty texture, dramatic silhouettes, intense and moody atmosphere, vintage detective comic feel, sharp angles."
        enabled: true
        sort-order: 5

      - id: minimalist
        name: Minimalist Vector
        description: Clean flat design with bold lines and limited colors
        prompt: "Minimalist vector illustration, flat design style, clean and bold lines, limited solid color palette with no gradients or shadows, geometric shapes, modern graphic design aesthetic, simplified forms, abstract composition, cheerful and clean, corporate art style."
        enabled: true
        sort-order: 6

  # Review Audio Configuration
  review:
    audio:
      enabled: false
      # Maximum number of audio files to generate per batch/request
      max-generation-count: 100
      # Audio storage path (local filesystem)
      storage-path: ${REVIEW_AUDIO_PATH:/Users/kasonzhan/Documents/kason-tools/review-audio}
      # Whether to generate audio asynchronously
      async-generation: true
      # Content to include in audio: english, chinese, both
      content-mode: both
      # Delay between API calls in milliseconds (to avoid rate limiting)
      api-call-delay-ms: 200
      # Scheduled job configuration for automatic audio generation
      scheduler:
        enabled: false  # Disabled by default in dev
        cron: "0 0 3 * * *"  # Run at 3:00 AM daily
        # Maximum paraphrases to process per scheduled run
        max-per-run: 500
        # Only generate for paraphrases created in the last N days
        lookback-days: 30

  # YouTube Configuration
  youtube:
    video:
      command: yt-dlp
      download:
        path: ${YT_DOWNLOAD_PATH:/Users/kasonzhan/Documents/kason-tools/ytb-data}
      large-subtitles:
        threshold: 1000
      batch:
        enabled: false
    proxy:
      enabled: false
      value: ""
    migration:
      enabled: true
    # Channel Video Sync Scheduler - fetches new videos and caches subtitles
    sync:
      enabled: true  # Disabled by default in dev
      cron: "0 0 */6 * * *"  # Every 6 hours
      fetch-subtitles: true  # Download and cache subtitles for new videos
      max-new-videos-per-channel: 50  # Max new videos to sync per channel per run
      consecutive-existing-threshold: 10  # Stop scanning after N consecutive already-synced videos
      run-on-startup: true  # Run immediately on application startup (for testing)

# ==================== AI Configuration ====================
ai:
  # AI Provider Selection: "grok" or "gemini"
  provider: gemini
  grok:
    api:
      key: ${GROK_API_KEY:}
      endpoint: https://api.x.ai/v1/chat/completions
      model: "grok-4-1-fast-reasoning"
      thread-prompts-line-size: 400
      thread-pool-size: 8
      thread-timeout-secs: 120
  gemini:
    api:
      project-id: ${GCP_PROJECT_ID:ENC(5q3wUNe5RH6F8ORU+aaVqa5XK6bF5pJwdHzcloHX3Uz2PyTTN5C7kw==)}
      location: us-central1
      model: "gemini-2.5-flash"
      # Gemini 2.5 Flash has 1M context window - can handle very large batches
      # This sends more subtitle lines per AI request, reducing total API calls
      thread-prompts-line-size: 2000
      # Higher concurrency - Gemini handles more parallel requests (1500+ RPM)
      thread-pool-size: 20
      thread-timeout-secs: 300
      temperature: 1.0
      # Gemini 2.5 Flash supports up to 65K output tokens
      max-output-tokens: 32768
  mode:
    directly-translation: "Translate the user prompt into #[TL]. Output the translation only—no labels, notes, or Markdown."
    translation-and-explanation: |
      #[TL] tutor for #[NL] speakers.

      RULES:
      - The learner is a native #[NL] speaker. NEVER include romanization, pinyin, furigana, or phonetic aids for #[NL].
      - Be concise. Every sentence must teach something. No filler, no redundancy, no restating what the learner can already see.
      - Only provide pronunciation help for #[TL] words when non-obvious.

      ## Translation
      Natural #[TL] translation.

      ---

      ## Key Vocabulary
      3–5 most useful words/phrases:
      - **word** (*pos*): #[NL] definition — how it differs from simpler alternatives

      ## Grammar Points
      1–2 key structures. For each in #[NL]: what the pattern is, why it's used here, and a common learner mistake.

      ## Tone & Usage
      One #[NL] paragraph: register, context, and when a native speaker would choose this phrasing.
