version: '3.8'

services:
  # MySQL Database
  kiwi-mysql:
    image: mysql:8.0
    container_name: kiwi-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-kiwi_db}
      TZ: ${TZ:-Pacific/Auckland}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  kiwi-redis:
    image: redis:7-alpine
    container_name: kiwi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch
  kiwi-elasticsearch:
    image: elasticsearch:7.17.9
    container_name: kiwi-elasticsearch
    restart: unless-stopped
    ports:
      - "${ES_PORT:-9201}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:?ES_PASSWORD must be set}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ:-Pacific/Auckland}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD:?ES_PASSWORD must be set} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
    name: kiwi_mysql_data
  redis_data:
    name: kiwi_redis_data
  es_data:
    name: kiwi_es_data
