# ==================== Development Profile Configuration ====================
# Local development environment settings

server:
  port: 8088

spring:
  # ==================== Flowable Exclusion ====================
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration

  # ==================== Database ====================
  datasource:
    url: jdbc:mysql://${DB_HOST_DEV:localhost}:${DB_PORT_DEV:3307}/${DB_NAME_DEV:kiwi_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Pacific/Auckland
    username: ${DB_USERNAME_DEV:root}
    password: ${DB_PASSWORD_DEV:kiwi123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      max-lifetime: 1800000
      connection-timeout: 60000
      initialization-fail-timeout: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST_DEV:localhost}
      port: ${REDIS_PORT_DEV:6380}
      password: ${REDIS_PASSWORD_DEV:kiwi123}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 100ms

  # ==================== Redis (for Redisson) ====================
  redis:
    host: ${REDIS_HOST_DEV:localhost}
    port: ${REDIS_PORT_DEV:6380}
    password: ${REDIS_PASSWORD_DEV:kiwi123}
    database: 0

  # ==================== Elasticsearch ====================
  elasticsearch:
    uris: ${ES_URIS_DEV:http://localhost:9201}
    username: ${ES_USERNAME_DEV:elastic}
    password: ${ES_PASSWORD_DEV:changeme}

  # ==================== File Upload ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==================== GCP Configuration ====================
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:ENC(5q3wUNe5RH6F8ORU+aaVqa5XK6bF5pJwdHzcloHX3Uz2PyTTN5C7kw==)}
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION:ENC(cicvoPPUGdVt01NMX91FN2X7ud3c6Fiu5CchvC8LDYEFENPuURkzAL0TXBJSBpaqs1w2Gbv5nZg=)}

  # ==================== Liquibase ====================
  liquibase:
    enabled: false

# ==================== Flowable (Disabled) ====================
flowable:
  process:
    enabled: false
  app:
    enabled: false
  idm:
    enabled: false
  cmmn:
    enabled: false
  dmn:
    enabled: false
  eventregistry:
    enabled: false
  async-executor-activate: false
  database-schema-update: false

# ==================== Logging ====================
logging:
  level:
    root: INFO
    me.fengorz.kiwi.config.RequestResponseLoggingFilter: DEBUG
    me.fengorz.kiwi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

