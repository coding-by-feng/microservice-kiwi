# ==================== Development Profile Configuration ====================
# Local development environment settings

server:
  port: 8088

spring:
  # ==================== Flowable Exclusion ====================
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.app.AppEngineAutoConfiguration
      - org.flowable.spring.boot.idm.IdmEngineAutoConfiguration
      - org.flowable.spring.boot.cmmn.CmmnEngineAutoConfiguration
      - org.flowable.spring.boot.dmn.DmnEngineAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration

  # ==================== Database ====================
  datasource:
    url: jdbc:mysql://${DB_HOST_DEV:localhost}:${DB_PORT_DEV:3307}/${DB_NAME_DEV:kiwi_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Pacific/Auckland
    username: ${DB_USERNAME_DEV:root}
    password: ${DB_PASSWORD_DEV}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      max-lifetime: 1800000
      connection-timeout: 60000
      initialization-fail-timeout: 60000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST_DEV:localhost}
      port: ${REDIS_PORT_DEV:6380}
      password: ${REDIS_PASSWORD_DEV}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 100ms

  # ==================== Redis (for Redisson) ====================
  redis:
    host: ${REDIS_HOST_DEV:localhost}
    port: ${REDIS_PORT_DEV:6380}
    password: ${REDIS_PASSWORD_DEV}
    database: 0

  # ==================== Elasticsearch ====================
  elasticsearch:
    uris: ${ES_URIS_DEV:http://localhost:9201}
    username: ${ES_USERNAME_DEV:elastic}
    password: ${ES_PASSWORD_DEV}

  # ==================== File Upload ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  # ==================== GCP Configuration ====================
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:ENC(5q3wUNe5RH6F8ORU+aaVqa5XK6bF5pJwdHzcloHX3Uz2PyTTN5C7kw==)}
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION:ENC(cicvoPPUGdVt01NMX91FN2X7ud3c6Fiu5CchvC8LDYEFENPuURkzAL0TXBJSBpaqs1w2Gbv5nZg=)}

  # ==================== Liquibase ====================
  liquibase:
    enabled: false

# ==================== Flowable (Disabled) ====================
flowable:
  process:
    enabled: false
  app:
    enabled: false
  idm:
    enabled: false
  cmmn:
    enabled: false
  dmn:
    enabled: false
  eventregistry:
    enabled: false
  async-executor-activate: false
  database-schema-update: false

# ==================== Storage ====================
storage:
  backend: ${STORAGE_BACKEND_DEV:minio}

ftp:
  host: ${FTP_HOST_DEV:localhost}
  port: ${FTP_PORT_DEV:22}
  username: ${FTP_USER_DEV:ftpuser}
  password: ${FTP_PASSWORD_DEV}
  baseDir: /kason-tools
  passiveMode: true
  connectTimeout: 15000
  dataTimeout: 30000

minio:
  endpoint: ${MINIO_ENDPOINT_DEV:http://localhost:9001}
  accessKey: ${MINIO_ACCESS_KEY_DEV:kiwi}
  secretKey: ${MINIO_SECRET_KEY_DEV:kiwi123456}
  bucket: ${MINIO_BUCKET_DEV:kiwi}
  connectTimeout: 10000
  readTimeout: 30000
  writeTimeout: 60000

# ==================== Logging ====================
logging:
  level:
    root: INFO
    me.fengorz.kiwi.config.RequestResponseLoggingFilter: DEBUG
    me.fengorz.kiwi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false

# ==================== Application Custom Config ====================
kiwi:
  # One-time code authentication (for anonymous access to trusted apps)
  auth:
    one-time-code: ${KIWI_ONE_TIME_CODE:}

  # HTTP Request/Response Logging (enable for debugging)
  logging:
    http:
      enabled: true
      include-headers: true
      include-body: true

  # FastDFS Configuration
  dfs:
    connect-timeout: 6000000
    so-timeout: 6000000
    tracker-list: ${FASTDFS_TRACKER_DEV:localhost:22122}
    gcp:
      bucket-name: kiwidict-bucket

  # File paths for dev environment
  file:
    crawler:
      voice:
        tmp-path: ${VOICE_TMP_PATH:/Users/zhanshifeng/Documents/myDocument/temp/microSerivceVocabularyEnhancer}
    vocabulary:
      word:
        list:
          path: ${WORD_LIST_PATH:/Users/zhanshifeng/Downloads}

  # TTS Configuration
  tts:
    # TTS Provider Selection: voicerss, baidu, gcp, deepgram, openai
    provider: openai
    chattts:
      base-url: http://kiwi-chattts:8000
      timeout: 30
      retry-count: 3
    deepgram:
      api-key: ${DEEPGRAM_API_KEY:}
      base-url: https://api.deepgram.com/v1/speak
      english-model: aura-asteria-en
      chinese-model: aura-lingxi-zh
    baidu:
      app-id: "20116041"
      api-key: ${BAIDU_TTS_API_KEY:ENC(/9nXqvG1VIte1VrACwZ683gw2o2K3fpRdAweh0edh1nFLd1CvjH4oA==)}
      secret-key: ${BAIDU_TTS_SECRET_KEY:ENC(G1gyeiupF4SDLkxRGm6FJ5a+Xxpp36sIrrtUnu5xZFKtZGnA7WYCPy+t+XHO0Kaa)}
      access-token: ${BAIDU_TTS_ACCESS_TOKEN:ENC(wykNby8I8mtu8pV5zd8khs8oUoF1GSFuS+y7zVGGhvHCF6+sUSUeSK3p3Q57wddHbZjYujpgoUMisz+fneF4E8tOpgTpdlThYC4j/tHtJfs=)}
    voicerss:
      url: 'https://api.voicerss.org/?key={}&r=-2&hl=en-us&v=Mary&c=MP3&f=16khz_16bit_stereo&src=test'
      api-keys: ${VOICERSS_API_KEYS:[]}
    # OpenAI TTS - $15/1M chars (tts-1, tts-1-hd, gpt-4o-mini-tts)
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1/audio/speech
      # Model options:
      # - tts-1: Standard quality, faster
      # - tts-1-hd: High quality
      # - gpt-4o-mini-tts: Steerable TTS with accent control
      model: gpt-4o-mini-tts
      english-voice: alloy  # alloy, echo, fable, onyx, nova, shimmer, coral, sage, ash
      chinese-voice: nova
      # English accent (only works with gpt-4o-mini-tts): US, UK, AU, IN
      english-accent: UK
      response-format: mp3  # mp3, opus, aac, flac, wav, pcm
      speed: 1.0  # 0.25 to 4.0

  # AI Conversation Generator Configuration
  ai:
    conversation:
      enabled: true
      # Maximum conversations per user per day
      max-daily-generations: 10
      # FTP storage path for conversation audio
      audio-storage-path: /conversation-audio
      # Delay between TTS API calls (ms) to avoid rate limiting
      tts-delay-ms: 200
      # SSE timeout in milliseconds (10 minutes)
      sse-timeout-ms: 600000
      # Speaker limits
      max-speakers: 4
      min-speakers: 2
      # Cache TTL in seconds
      cache-ttl-seconds: 3600

  # Review Audio Configuration
  review:
    audio:
      enabled: false
      # Maximum number of audio files to generate per batch/request
      max-generation-count: 100
      # Audio storage path (local filesystem)
      storage-path: ${REVIEW_AUDIO_PATH:/Users/kasonzhan/Documents/kason-tools/review-audio}
      # Whether to generate audio asynchronously
      async-generation: true
      # Content to include in audio: english, chinese, both
      content-mode: both
      # Delay between API calls in milliseconds (to avoid rate limiting)
      api-call-delay-ms: 200
      # Scheduled job configuration for automatic audio generation
      scheduler:
        enabled: false  # Disabled by default in dev
        cron: "0 0 3 * * *"  # Run at 3:00 AM daily
        # Maximum paraphrases to process per scheduled run
        max-per-run: 500
        # Only generate for paraphrases created in the last N days
        lookback-days: 30

  # YouTube Configuration
  youtube:
    video:
      command: yt-dlp
      download:
        path: ${YT_DOWNLOAD_PATH:/Users/kasonzhan/Documents/kason-tools/ytb-data}
      large-subtitles:
        threshold: 1000
      batch:
        enabled: false
    proxy:
      enabled: false
      value: ""
    migration:
      enabled: true
    # Channel Video Sync Scheduler - fetches new videos and caches subtitles
    sync:
      enabled: true  # Disabled by default in dev
      cron: "0 0 */6 * * *"  # Every 6 hours
      fetch-subtitles: true  # Download and cache subtitles for new videos
      max-videos-per-channel: 50  # Limit videos fetched per channel per run
      run-on-startup: true  # Run immediately on application startup (for testing)

# ==================== AI Configuration ====================
ai:
  # AI Provider Selection: "grok" or "gemini"
  provider: gemini
  grok:
    api:
      key: ${GROK_API_KEY:}
      endpoint: https://api.x.ai/v1/chat/completions
      model: "grok-4-1-fast-reasoning"
      thread-prompts-line-size: 400
      thread-pool-size: 8
      thread-timeout-secs: 120
  gemini:
    api:
      key: ${GEMINI_API_KEY:}
      endpoint: https://generativelanguage.googleapis.com/v1beta/models
      model: "gemini-2.5-flash"
      # Gemini 2.5 Flash has 1M context window - can handle very large batches
      # This sends more subtitle lines per AI request, reducing total API calls
      thread-prompts-line-size: 2000
      # Higher concurrency - Gemini handles more parallel requests (1500+ RPM)
      thread-pool-size: 20
      thread-timeout-secs: 300
      temperature: 1.0
      # Gemini 2.5 Flash supports up to 65K output tokens
      max-output-tokens: 32768
  mode:
    directly-translation: "Translate the user prompt into #[TL]. Output the translation only—no labels, notes, or Markdown."
    translation-and-explanation: "Translate the user prompt into #[TL] on the first line. Then, in #[NL], give a thorough explanation covering word choice, tone/register, key grammar, and cultural/usage notes. No Markdown or extra headers."
    grammar-explanation: "Translate the user prompt into #[NL]. Then, in #[NL], explain the grammar (parts of speech, sentence structure, tense/aspect, key patterns, and tricky points). Keep it concise and clear."
    grammar-correction: "1) Provide a grammatically corrected version of the text (original language). 2) Translate the corrected text into #[NL]. 3) In #[NL], explain each correction (what changed and why). Output in that order. No extra commentary."
    natural-idiomatic-retouch: "Rewrite the text in #[TL] so that it is grammatically correct, natural, and idiomatic, as if written by an educated native speaker. Preserve the original meaning and tone, but improve word choice, sentence flow, and style. Output only the polished #[TL] version, with #[NL] explanations."
    vocabulary-explanation: "Explain the vocabulary item in both #[TL] and #[NL]. Provide paraphrases in both languages grouped by part of speech (verb, noun, adjective, adverb, etc.). For each part of speech, give 1–3 demo sentences in #[TL] with #[NL] translations. Skip any part of speech that does not apply."
    synonym: "List 5–8 common synonyms in #[TL]. For each, briefly explain the nuance in #[NL] and give one example sentence in #[TL] with a #[NL] translation. Output plain text only—no Markdown or extra commentary."
    antonym: "List 5–8 common antonyms in #[TL]. For each, briefly explain the nuance in #[NL] and give one example sentence in #[TL] with a #[NL] translation. Output plain text only—no Markdown or extra commentary."
    subtitle-translator: |
      Translate subtitle fragments line by line. CRITICAL: Maintain exact 1:1 line mapping.

      RULES:
      1. Each INPUT line produces exactly TWO OUTPUT lines (original + translation)
      2. Do NOT merge multiple input lines into one sentence
      3. Do NOT split one input line into multiple output lines
      4. Translate each fragment as-is, even if incomplete
      5. Add punctuation only at natural pauses within each fragment
      6. Separate each pair with exactly ONE blank line

      FORMAT (for each input line):
      [Original #[TL] text with minimal punctuation fixes]
      [#[NL] translation of that exact fragment]

      [Next original #[TL] text]
      [#[NL] translation]

      EXAMPLE:
      Input:
      It's America versus China today as we
      put the Tesla Model Y refresh up against
      the new BYD Sealion 7

      Output:
      It's America versus China today as we
      今天是美国对战中国，我们

      put the Tesla Model Y refresh up against
      将特斯拉 Model Y 改款版与

      the new BYD Sealion 7
      全新比亚迪海狮07进行对比

      No Markdown, no labels, no extra commentary.
    subtitle-retouch: |
      Retouch auto-generated subtitle fragments. CRITICAL: Maintain exact 1:1 line mapping.

      RULES:
      1. Each INPUT line produces exactly ONE OUTPUT line
      2. Do NOT merge multiple input lines into one
      3. Do NOT split one input line into multiple output lines
      4. Fix capitalization and add punctuation ONLY at natural pauses within each fragment
      5. Keep fragments as-is, even if sentences are incomplete
      6. Remove redundant symbols but preserve meaning

      EXAMPLE:
      Input:
      its america versus china today as we
      put the tesla model y refresh up against

      Output:
      It's America versus China today as we
      put the Tesla Model Y refresh up against

      No Markdown, no labels, no extra commentary.
    subtitle-retouch-translator: |
      Retouch and translate auto-generated subtitle fragments. CRITICAL: Maintain exact 1:1 line mapping.

      RULES:
      1. Each INPUT line produces exactly TWO OUTPUT lines (retouched original + translation)
      2. Do NOT merge multiple input lines into one sentence
      3. Do NOT split one input line into multiple output lines
      4. Fix capitalization and add punctuation ONLY at natural pauses within each fragment
      5. Translate each fragment as-is, even if the sentence is incomplete
      6. Separate each pair with exactly ONE blank line
      7. If a line is already in #[NL], only correct it and output without translation

      FORMAT (for each input line):
      [Retouched #[TL] fragment with capitalization and punctuation fixes]
      [#[NL] translation of that exact fragment]

      [Next retouched #[TL] fragment]
      [#[NL] translation]

      EXAMPLE:
      Input:
      its america versus china today as we
      put the tesla model y refresh up against
      the new byd sealion 7 to see which of

      Output:
      It's America versus China today as we
      今天是美国对战中国，我们

      put the Tesla Model Y refresh up against
      将特斯拉 Model Y 改款版与

      the new BYD Sealion 7 to see which of
      全新比亚迪海狮07进行对比，看看哪款

      No Markdown, no labels, no extra commentary.
    subtitle-punctuation-only: |
      Add punctuation and fix capitalization to each subtitle line.

      CRITICAL RULES:
      1. Keep EXACTLY the same number of lines as input
      2. Do NOT merge lines or split lines
      3. Do NOT change word order
      4. Do NOT add or remove words
      5. ONLY add punctuation marks (. , ? ! ' ") and fix capitalization
      6. Each output line corresponds to exactly one input line

      Input format:
      [line 1 text]
      [line 2 text]
      ...

      Output format (same number of lines):
      [line 1 with punctuation]
      [line 2 with punctuation]
      ...

      Example:
      Input:
      yo your place kind of fire though
      this place be phantom taxing

      Output:
      Yo, your place kind of fire though.
      This place be phantom taxing.
    vocabulary-association: |
      List 8-10 common #[TL] words/phrases that express the user prompt's meaning.
      For each word, provide in this exact format:

      📖 **Word** (Part of Speech) — Register
      Definition in one sentence
      Translation in #[NL]
      ✏️ Example sentence in #[TL]
      ✏️ Translation of example in #[NL]

      Separate each entry with a blank line.
      Register options: Formal / Neutral / Informal / Technical
      Prioritize high-frequency, practical vocabulary.
      Do not include language labels like "EN:" or "ZH_CN:" in output.
    phrases-association: "List as many common #[TL] phrases as possible that can express the user prompt's meaning. For each phrase, explain nuances, register, and usage differences in #[NL]. Group by function or context when helpful. Plain text only."
    selection-explanation: "Respond only in #[TL]. Explain the selected phrase \"#[S0]\" strictly based on the sentence #[S1] in 1–2 concise paragraphs. No headings, labels, English, Markdown, bullet points, or backslashes. Do not restate the full sentence; focus on meaning, nuance, tense/aspect, and function in context."
    vocabulary-character-expansion: |
      vocabulary-family-expansion:
      For the input word, generate a complete word-family #[TL] map including:
      1) Verbs
      2) Nouns
      3) Adjectives
      4) Adverbs

      For each item, use the format:
      word (#[NL] Chinese translation; #[NL] nuance or usage explanation)

      Structure:
      Verbs: v1 (#[NL] translation; #[NL] nuance), v2 (...), v3 (...)
      Nouns: n1 (...), n2 (...)
      Adjectives: a1 (...), a2 (...)
      Adverbs: adv1 (...), adv2 (...)

      Rules:
      - Include only words that are truly related by root, morphology, or strong semantic relation
      - Prioritize the most common 3–6 items in each group
      - Nuance must be short, clear, and show how the word differs in use
      - Output only English except for the Chinese translations
      - Do not add any extra commentary outside the required structure
    ambiguous-association-correction: |
      Correction:
      Provide the corrected form of the input. If the input is misspelled, grammatically incorrect, or ambiguous, correct it or choose the most likely intended meaning. If no clear correction exists, set Correction to Unknown.

      Alternatives:
      List several closely related, commonly confused, or meaning-adjacent alternatives (alt1, alt2, alt3). All alternatives must be in #[TL].

      Rules:
      - Detect and correct misspellings, unclear expressions, or ambiguous phrases
      - Always output both Correction and Alternatives
      - Alternatives must be realistic confusion candidates, not random words
      - If Correction is Unknown, still provide Alternatives
      - Output in plain text only, no Markdown
    conversation-generation: |
      Generate a natural English conversation. Output ONLY valid JSON with this structure:
      {
        "topic": "A refined, concise topic title",
        "speakers": [
          {"index": 0, "name": "FirstName", "personality": "brief personality", "emoji": "avatar emoji"},
          {"index": 1, "name": "FirstName", "personality": "brief personality", "emoji": "avatar emoji"}
        ],
        "messages": [
          {"speakerIndex": 0, "text": "Message text", "emoji": "relevant emoji"},
          {"speakerIndex": 1, "text": "Response text", "emoji": "relevant emoji"}
        ]
      }

      Rules:
      - Create distinct speaker personalities and speaking styles
      - Include natural conversational elements (greetings, reactions, follow-ups)
      - Each message should be 1-3 sentences, suitable for TTS
      - Include one relevant emoji per message
      - Make dialogue authentic and engaging
      - No Markdown, no extra text outside JSON

# ==================== Google OAuth2 Configuration ====================
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oauth/google/callback}
    scopes:
      - openid
      - profile
      - email
    home-page: ${GOOGLE_HOME_PAGE:http://localhost:8080}

# ==================== Security Ignore URLs ====================
ignore:
  urls:
    # Common
    - /actuator/**
    - /test/**
    - /log/**
    # Auth endpoints (public)
    - /auth/oauth/google/**
    - /api/oauth/one-time/**
    # UPMS Service (new /api prefix)
    - /api/log/**
    # Word Service (new /api prefix)
    - /api/word/name/**
    - /api/word/search
    - /api/word/fuzzy
    - /api/word/autocomplete
    - /api/word/exists/**
    - /api/word/pronunciation/download/**
    - /api/word/fetch/**
    - /api/word/main/fuzzyQueryList
    - /api/word/main/query/**
    # Tools Service (legacy paths)
    - /rangi_windows/api/**
    # Tools Service (new /api prefix)
    - /api/rangi_windows/**
    - /api/tools/project/**
